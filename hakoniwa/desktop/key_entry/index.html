<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>录入密钥</title>
    <style>
      body {
        margin: 0;
        padding: 20px 24px;
        background: #1b1d22;
        color: #e8e4da;
        font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .note {
        margin: 0 0 12px;
        color: #a9a49a;
        font-size: 12px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 6px 8px;
        background: #0f1013;
        color: inherit;
        border: 1px solid #4a4d55;
        border-radius: 3px;
      }
      #status {
        min-height: 1.6em;
        margin: 6px 0;
        color: #e0a070;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .grow {
        flex: 1;
      }
      button {
        padding: 4px 14px;
        background: #2c2f36;
        color: inherit;
        border: 1px solid #4a4d55;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>录入密钥</h1>
    <p class="note">密钥只交给本机的大模型网关保存，游戏界面看不到它。</p>
    <input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="密钥" />
    <p id="status" role="status"></p>
    <div class="row">
      <button id="paste" type="button">粘贴</button>
      <span class="grow"></span>
      <button id="cancel" type="button">取消</button>
      <button id="save" type="button">保存</button>
    </div>
    <script src="./page.js"></script>
  </body>
</html>
